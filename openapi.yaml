    delete:
      tags:
      - index
      summary: Delete artifact
      description: Deletes the artifact and all its versions, files, and tags (cascade).
      x-required-permission: index:artifacts:delete
      x-resource-type: artifact
      responses:
        '204':
          description: Artifact deleted
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/versions:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    get:
      tags:
      - index
      summary: List versions
      description: Returns the artifact's versions, newest first (major, minor, patch DESC). Accepts the
        same filters as the bulk delete on this path (combined with AND), so a UI can show what a cleanup
        would hit; add `deletable=true` to see exactly the versions the DELETE would remove.
      x-required-permission: index:artifacts:read
      parameters:
      - $ref: '#/components/parameters/IndexKeepLast'
      - $ref: '#/components/parameters/IndexOlderThanFilter'
      - $ref: '#/components/parameters/IndexVersionFrom'
      - $ref: '#/components/parameters/IndexVersionBelow'
      - $ref: '#/components/parameters/IndexVersionList'
      - $ref: '#/components/parameters/IndexHasFiles'
      - $ref: '#/components/parameters/IndexHasIncompleteFiles'
      - $ref: '#/components/parameters/IndexMinBytes'
      - $ref: '#/components/parameters/IndexMaxBytes'
      - $ref: '#/components/parameters/IndexDeletable'
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexVersionResponse'
        '400':
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    post:
      tags:
      - index
      summary: Create version
      description: Creates a new version. Tags listed in `tags[]` are atomically assigned to this version
        (upsert semantics — a tag previously on another version moves here).
      x-required-permission: index:versions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexCreateVersionRequest'
      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexVersionResponse'
        '400':
          description: Invalid request body or malformed semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '409':
          description: Version already exists for this artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Bulk delete versions
      description: Deletes the versions of this artifact matching the filters, with their files. All given
        filters must match (AND); at least one is required. Versions a tag points at, and every version
        of an artifact carrying the protection tag, are never deleted and are counted as `skipped`. Files
        of deleted versions are removed from storage (best-effort, after the DB commit).
      x-required-permission: index:versions:delete
      x-resource-type: artifact
      parameters:
      - $ref: '#/components/parameters/IndexKeepLast'
      - $ref: '#/components/parameters/IndexOlderThanFilter'
      - $ref: '#/components/parameters/IndexVersionFrom'
      - $ref: '#/components/parameters/IndexVersionBelow'
      - $ref: '#/components/parameters/IndexVersionList'
      - $ref: '#/components/parameters/IndexHasFiles'
      - $ref: '#/components/parameters/IndexHasIncompleteFiles'
      - $ref: '#/components/parameters/IndexMinBytes'
      - $ref: '#/components/parameters/IndexMaxBytes'
      - $ref: '#/components/parameters/IndexDryRun'
      responses:
        '200':
          description: Deleted (or, with dryRun, deletable) versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkVersionDeleteResponse'
        '400':
          description: No filter given or invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/versions:
    get:
      tags:
      - index
      summary: List versions across all artifacts
      description: Paginated, ordered by artifact then newest version first. Same filters as `DELETE /api/v1/admin/versions`
        — its read-only counterpart for every reader.
      x-required-permission: index:artifacts:read
      parameters:
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      - $ref: '#/components/parameters/IndexKeepLast'
      - $ref: '#/components/parameters/IndexOlderThanFilter'
      - $ref: '#/components/parameters/IndexVersionFrom'
      - $ref: '#/components/parameters/IndexVersionBelow'
      - $ref: '#/components/parameters/IndexHasFiles'
      - $ref: '#/components/parameters/IndexHasIncompleteFiles'
      - $ref: '#/components/parameters/IndexMinBytes'
      - $ref: '#/components/parameters/IndexMaxBytes'
      - $ref: '#/components/parameters/IndexDeletable'
      responses:
        '200':
          description: Paginated version list
          content:
            application/json:
