            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        resources:
          $ref: '#/components/schemas/K8sResourceRequirements'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/WeaveVolumeMount'
        serviceAccountName:
          type: string
        podSecurityContext:
          type: object
          additionalProperties: true
        containerSecurityContext:
          type: object
          additionalProperties: true
        replicas:
          type: integer
          minimum: 1
          default: 1
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveServicePort'
        livenessProbe:
          type: object
          additionalProperties: true
        readinessProbe:
          type: object
          additionalProperties: true
        startupProbe:
          type: object
          additionalProperties: true
        serviceType:
          type: string
          enum:
          - ClusterIP
          - NodePort
          - LoadBalancer
          default: ClusterIP
        ingress:
          $ref: '#/components/schemas/WeaveIngressSpec'
        unhealthyDuration:
          type: string
          default: 5m
        revisionHistoryLimit:
          type: integer
          default: 5
          minimum: 1
        codeSource:
          $ref: '#/components/schemas/WeaveCodeSourceSpec'
    WeaveServiceTemplateStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        valid:
          type: boolean
        validationMessage:
          type: string
    WeaveServiceTemplate:
      type: object
      properties:
        kind:
          type: string
          example: WeaveServiceTemplate
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveServiceTemplateSpec'
        status:
          $ref: '#/components/schemas/WeaveServiceTemplateStatus'
    WeaveServiceTemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveServiceTemplate'
    WeaveChainStep:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        stepKind:
          type: string
          enum:
          - Job
          - Deploy
          default: Job
        jobTemplateRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        serviceTemplateRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        dependsOn:
          type: array
          items:
            type: string
        runOnSuccess:
          type: boolean
          default: true
        runOnFailure:
          type: boolean
          default: false
        envOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        producesOutput:
          type: boolean
        consumesOutputFrom:
          type: array
          items:
            type: string
    WeaveSharedStorageSpec:
      type: object
      required:
      - size
      properties:
        size:
          type: string
          example: 500Mi
        storageClassName:
          type: string
          nullable: true
    WeaveChainSpec:
      type: object
      required:
      - steps
      properties:
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveChainStep'
        failurePolicy:
          type: string
          enum:
          - StopAll
          - ContinueOthers
          - RetryFailed
          default: StopAll
        concurrencyPolicy:
          type: string
          enum:
          - Wait
          - Forbid
          default: Wait
        sharedStorage:
          $ref: '#/components/schemas/WeaveSharedStorageSpec'
        authSecretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Optionally names a Secret injected via envFrom into every step pod
            of this chain (Job and Deploy kind alike). Its keys become
            environment variables that runner-side helper libraries (e.g. the
            fusion-runner Python KeycloakAuth helper) use to obtain access
            tokens. Overridable per-trigger (authSecretRefOverride) or
            per-run (authSecretRefOverride); precedence is run > trigger > chain.
        externalAuthRef:
          $ref: '#/components/schemas/WeaveExternalAuthRef'
          description: >-
            Optionally names a deploy-time-allowlisted external identity the
            operator mints a short-lived token for and injects into every
            Job-kind step pod of this chain (never Deploy-kind). Independent
            of authSecretRef — both may be set together. Overridable
            per-trigger (externalAuthRefOverride) or per-run
            (externalAuthRefOverride); precedence is run > trigger > chain.
        unsafeEnvironmentInjector:
          type: boolean
          nullable: true
          default: true
          description: >-
            Controls whether authSecretRef and externalAuthRef are ALSO
            injected as environment variables, on top of the always-unconditional
            file mounts both mechanisms provide. Defaults to true when null, so
            existing chains relying on authSecretRef's envFrom behavior are
            unaffected. Overridable per-trigger
            (unsafeEnvironmentInjectorOverride) or per-run
            (unsafeEnvironmentInjectorOverride).
    WeaveExternalAuthRef:
      type: object
      required:
      - mode
      - name
      properties:
        mode:
          type: string
          enum:
          - serviceAccount
          - oidc
          description: >-
            Selects which deploy-time allowlist name is validated against:
            "serviceAccount" (helm externalAuth.serviceAccounts) or "oidc"
            (helm externalAuth.oidcSecrets).
        name:
          type: string
          minLength: 1
          description: >-
            Must match an entry in the allowlist for mode. For serviceAccount
            mode this is the ServiceAccount name the operator mints a
            TokenRequest token for. For oidc mode this is the name of the
            Secret holding Keycloak client credentials the operator uses for
            a client_credentials grant.
    WeaveExternalAuthOptions:
      type: object
      properties:
        serviceAccounts:
          type: array
          items:
            type: string
          description: Allowlisted ServiceAccount names for externalAuthRef mode=serviceAccount.
        oidcSecrets:
          type: array
          items:
            type: string
          description: Allowlisted Secret names for externalAuthRef mode=oidc.
    WeaveActiveDeploymentStatus:
      type: object
      properties:
        deploymentName:
          type: string
        stepName:
          type: string
        health:
          type: string
          enum:
          - Healthy
          - Unhealthy
          - RollingBack
          - RolledBack
          - Unknown
        currentRevision:
          type: string
        lastRollbackRevision:
          type: string
        unhealthySince:
          type: string
          format: date-time
          nullable: true
        lastRollbackTime:
          type: string
          format: date-time
          nullable: true
        unhealthyDurationSeconds:
          type: integer
          format: int64
        message:
          type: string
        image:
          type: string
          description: Container image the Deployment currently runs when set through a WeaveRun image override. Empty otherwise.
        previousImage:
          type: string
          description: Image that ran before the last image override change; kept for one-step rollback and audit.
        codeSourceArtifact:
          type: string
        codeSourceTag:
          type: string
        codeSourceIndexURL:
          type: string
        codeSourceDeployedVersion:
          type: string
    WeaveChainStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        valid:
          type: boolean
        validationMessage:
          type: string
        activeDeployments:
          type: object
          description: keyed by "<chainName>-<stepName>"
          additionalProperties:
            $ref: '#/components/schemas/WeaveActiveDeploymentStatus'
    WeaveChain:
      type: object
      properties:
        kind:
          type: string
          example: WeaveChain
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveChainSpec'
        status:
          $ref: '#/components/schemas/WeaveChainStatus'
    WeaveChainList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveChain'
    WeaveWebhookConfig:
      type: object
      required:
      - path
      properties:
        path:
          type: string
          minLength: 2
          pattern: ^/.*
        secretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveBatchCronConfig:
      type: object
      required:
      - jobsConfigMapRef
      properties:
        jobsConfigMapRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveKafkaConfig:
      type: object
      required:
      - brokers
      - topic
      - consumerGroup
      properties:
        brokers:
          type: array
          items:
            type: string
        topic:
          type: string
        consumerGroup:
          type: string
        secretRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        eventFilter:
          type: array
          items:
            type: string
            enum:
            - put
            - delete
            - get
        bucketFilter:
          type: array
          items:
            type: string
        maxConcurrentRuns:
          type: integer
          description: 0 = unlimited
    WeaveTriggerSpec:
      type: object
      required:
      - chainRef
      - type
      properties:
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        type:
          type: string
          enum:
          - OnDemand
          - Cron
          - Webhook
          - BatchCron
          - Kafka
        schedule:
          type: string
          description: Cron expression; only for type=Cron
        webhook:
          $ref: '#/components/schemas/WeaveWebhookConfig'
        batchCron:
          $ref: '#/components/schemas/WeaveBatchCronConfig'
        kafka:
          $ref: '#/components/schemas/WeaveKafkaConfig'
        paused:
          type: boolean
        authSecretRefOverride:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Overrides WeaveChainSpec.authSecretRef for every run created by
            this trigger. Takes precedence over the chain default; yields to
            WeaveRunSpec.authSecretRefOverride on the resulting run.
        externalAuthRefOverride:
          $ref: '#/components/schemas/WeaveExternalAuthRef'
          description: >-
            Overrides WeaveChainSpec.externalAuthRef for every run created by
            this trigger. Takes precedence over the chain default; yields to
            WeaveRunSpec.externalAuthRefOverride on the resulting run.
        unsafeEnvironmentInjectorOverride:
          type: boolean
          nullable: true
          description: >-
            Overrides WeaveChainSpec.unsafeEnvironmentInjector for every run
            created by this trigger. Takes precedence over the chain default;
            yields to WeaveRunSpec.unsafeEnvironmentInjectorOverride on the
            resulting run.
        parameterOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        imageOverrides:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunImageOverride'
          description: >-
            Copied into every run created by this trigger (same validation as
            WeaveRunSpec.imageOverrides). Job steps only in practice — a trigger
            cannot set stepOverrides, so deploy-step overrides fail the run.
    WeaveTriggerStatus:
      type: object
      properties:
        active:
          type: boolean
        lastScheduleTime:
          type: string
          format: date-time
          nullable: true
        lastRunName:
          type: string
        webhookURL:
          type: string
        pendingRuns:
          type: array
          items:
            type: string
        batchJobCount:
          type: integer
          description: BatchCron only
        batchJobErrors:
          type: integer
          description: BatchCron only
        inactiveReason:
          type: string
          description: >-
            Explains why active is false (e.g. chain not found or invalid).
            Empty when active is true. Distinct from quarantineReason: this
            reflects an ordinary, self-healing condition on the referenced
            chain, not a system-recovered panic.
        quarantined:
          type: boolean
          description: >-
            True when the operator auto-disabled this trigger's activation
            source (cron/batchCron/kafka goroutine) after recovering a panic,
            to stop it from repeatedly failing. Distinct from spec.paused,
            which is a user action. While true, the trigger's activation
            source is unregistered and will not fire. Clear it by setting the
            fusion-platform.io/reset annotation to "true".
        quarantineReason:
          type: string
          description: Describes the panic that caused quarantine.
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
          description: When the trigger was quarantined.
    WeaveTrigger:
      type: object
      properties:
        kind:
          type: string
          example: WeaveTrigger
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveTriggerSpec'
        status:
          $ref: '#/components/schemas/WeaveTriggerStatus'
    WeaveListMeta:
      type: object
      description: Pagination of a weave list; both fields are set only while more items follow.
      properties:
        continue:
          type: string
        remainingItemCount:
          type: integer
          format: int64
    WeaveRunFacets:
      type: object
      properties:
        total:
          type: integer
        phase:
          type: object
          additionalProperties:
            type: integer
        chain:
          type: object
          additionalProperties:
            type: integer
        trigger:
          type: object
          additionalProperties:
            type: integer
        source:
          type: object
          additionalProperties:
            type: integer
    WeaveTriggerList:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/WeaveListMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveTrigger'
    WeaveBatchTriggerRequest:
      type: object
      required:
      - name
      - chainRef
      - jobs
      properties:
        name:
          type: string
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        jobs:
          type: string
          description: Raw jobs YAML parsed via trigger.ParseBatchJobs
    WeaveBatchValidationError:
      type: object
      properties:
        line:
          type: integer
        message:
          type: string
    WeaveBatchValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/WeaveBatchValidationError'
    WeaveKafkaTriggerRequest:
      type: object
      required:
      - name
      - chainRef
      - kafka
      properties:
        name:
          type: string
          description: Required on create only
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        kafka:
          $ref: '#/components/schemas/WeaveKafkaConfig'
    WeaveRunStepOverride:
      type: object
      required:
      - stepName
      properties:
        stepName:
          type: string
        artifactName:
          type: string
          description: >-
            Full fusion-index artifact name. Must be set together with tag, or both
            omitted for image-only mode (run-owned Deployment with a custom image from
            imageOverrides, no code-loader and no fusion-index lookup; ports, resources
            and env come from the WeaveServiceTemplate).
        tag:
          type: string
          description: Mutable tag to track. Required with artifactName.
        ingressName:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          description: Leftmost DNS label for this step's ingress hostname; the
            operator appends the cluster-wide ingress host suffix to form the
            full hostname.
        indexURL:
          type: string
    WeaveAppIngressRule:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Leftmost DNS label; the operator appends the instance-wide ingress host suffix.
        path:
          type: string
          default: /
        pathType:
          type: string
          enum: [Exact, Prefix, ImplementationSpecific]
          default: Prefix
        servicePort:
          type: string
          description: Name of a service port; optional when the service has a single port.
    WeaveAppIngress:
      type: object
      required:
      - rules
      properties:
        ingressClassName:
          type: string
          nullable: true
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WeaveAppIngressRule'
        tlsSecretName:
          type: string
    WeaveAppService:
      type: object
      description: Service settings; required for type=service.
      properties:
        ports:
          type: array
          items:
            $ref: '#/components/schemas/WeaveServicePort'
        replicas:
          type: integer
          minimum: 1
        serviceType:
          type: string
          enum: [ClusterIP, NodePort, LoadBalancer]
        ingressName:
          type: string
          description: Shorthand for a single ingress rule; mutually exclusive with ingress.
        ingress:
          $ref: '#/components/schemas/WeaveAppIngress'
        ingressAnnotations:
          type: object
          additionalProperties:
            type: string
          description: Per-app Ingress annotations (e.g. traefik.ingress.kubernetes.io/*); extend and on collision override the instance-wide and runner-type annotations. Additive — a removed key stays on an existing Ingress. Requires ingressName or ingress.
        livenessProbe:
          type: object
          additionalProperties: true
        readinessProbe:
          type: object
          additionalProperties: true
        startupProbe:
          type: object
          additionalProperties: true
    WeaveAppWritablePath:
      type: object
      required:
      - mountPath
      properties:
        mountPath:
          type: string
          pattern: '^/.+'
          description: Absolute path inside the container (e.g. /var/cache/nginx).
        sizeLimit:
          type: string
          description: Kubernetes quantity (e.g. 200Mi); the pod is evicted when exceeded.
        medium:
          type: string
          enum: [Memory]
          description: Memory backs the emptyDir with tmpfs (counts against the memory limit).
    WeaveAppEntrypoint:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        schedule:
          type: string
          description: 6-field cron expression. Without it the entrypoint runs only when fired via the fusion-platform.io/fire annotation.
    WeaveAppSpec:
      type: object
      required:
      - type
      - image
      properties:
        type:
          type: string
          enum: [service, job]
        image:
          type: string
          description: Subject to the operator's ALLOWED_IMAGE_PREFIXES policy (explicit non-latest tag or digest) when configured.
        codeSource:
          $ref: '#/components/schemas/WeaveCodeSourceSpec'
        command:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        resources:
          $ref: '#/components/schemas/K8sResourceRequirements'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/WeaveVolumeMount'
        writablePaths:
          type: array
          description: Writable emptyDirs for images running with readOnlyRootFilesystem; appended to the operator-wide and runner-type writable paths (an entry for an already-mounted path only sets sizeLimit/medium). Invalid paths make the app Invalid.
          items:
            $ref: '#/components/schemas/WeaveAppWritablePath'
        serviceAccountName:
          type: string
        podSecurityContext:
          type: object
          additionalProperties: true
        containerSecurityContext:
          type: object
          additionalProperties: true
        service:
          $ref: '#/components/schemas/WeaveAppService'
        entrypoints:
          type: array
          description: type=job only.
          items:
            $ref: '#/components/schemas/WeaveAppEntrypoint'
        externalAuthRef:
          $ref: '#/components/schemas/WeaveExternalAuthRef'
          description: type=job only.
        unsafeEnvironmentInjector:
          type: boolean
          nullable: true
        activeDeadlineSeconds:
          type: integer
          format: int64
          nullable: true
        executionTTLSeconds:
          type: integer
          format: int32
          nullable: true
          description: How long finished Jobs are kept.
    WeaveAppExecution:
      type: object
      properties:
        entrypoint:
          type: string
        jobName:
          type: string
        phase:
          type: string
          enum: [Running, Succeeded, Failed]
        startTime:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time
        message:
          type: string
    WeaveAppStatus:
      type: object
      properties:
        observedGeneration:
          type: integer
          format: int64
        phase:
          type: string
          enum: [Pending, Ready, Running, Invalid]
        validationMessage:
          type: string
        deploymentName:
          type: string
        codeSourceDeployedVersion:
          type: string
        executions:
          type: array
          description: Last 20 executions (type=job).
          items:
            $ref: '#/components/schemas/WeaveAppExecution'
    WeaveApp:
      type: object
      properties:
        kind:
          type: string
          example: WeaveApp
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveAppSpec'
        status:
          $ref: '#/components/schemas/WeaveAppStatus'
    WeaveAppList:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/WeaveListMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveApp'
    WeaveRunImageOverride:
      type: object
      required:
      - stepName
      - image
      properties:
        stepName:
          type: string
          minLength: 1
          description: Chain step whose template image is replaced. At most one entry per step.
        image:
          type: string
          minLength: 1
          description: >-
            Full image reference with an explicit immutable tag or a digest (untagged and
            :latest are rejected). Must start with one of the operator's
            ALLOWED_IMAGE_PREFIXES; overrides are disabled when none are configured.
        imagePullPolicy:
          type: string
          enum:
          - Always
          - IfNotPresent
          - Never
          description: Overrides the template's pull policy for this step.
    WeaveRunSpec:
      type: object
      required:
      - chainRef
      properties:
        chainRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        triggerRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        parameterOverrides:
          type: array
          items:
            $ref: '#/components/schemas/K8sEnvVar'
        stepOverrides:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunStepOverride'
        imageOverrides:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunImageOverride'
          description: >-
            Replaces the container image of individual steps for this run only, so one
            chain/template can serve many customers. Job steps: applies to every Job
            created afterwards. Deploy steps must be run-owned (have a stepOverrides
            entry); an override on a chain-owned deploy step is rejected. Unlike the rest
            of the run spec this field may change after creation: PATCH a new image to
            roll a Deployed run-owned Deployment (previous image kept in
            status.activeDeployments[].previousImage). POST/PUT answer 400 on a
            tag/prefix/duplicate violation; PATCH is validated only by the operator, which
            ignores an invalid image and explains it in the step message.
        authSecretRefOverride:
          $ref: '#/components/schemas/K8sLocalObjectReference'
          description: >-
            Overrides WeaveChainSpec.authSecretRef (and any
            WeaveTriggerSpec.authSecretRefOverride) for this run only.
            Injected via envFrom into every step pod of this run.
        externalAuthRefOverride:
          $ref: '#/components/schemas/WeaveExternalAuthRef'
          description: >-
            Overrides WeaveChainSpec.externalAuthRef (and any
            WeaveTriggerSpec.externalAuthRefOverride) for this run only.
        unsafeEnvironmentInjectorOverride:
          type: boolean
          nullable: true
          description: >-
            Overrides WeaveChainSpec.unsafeEnvironmentInjector (and any
            WeaveTriggerSpec.unsafeEnvironmentInjectorOverride) for this run
            only.
    WeaveRunStepStatus:
      type: object
      properties:
        name:
          type: string
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Skipped
          - Retrying
          - Deployed
        jobRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
        retryCount:
          type: integer
        nextRetryAfter:
          type: string
          format: date-time
          nullable: true
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        outputCaptured:
          type: boolean
        deploymentRef:
          $ref: '#/components/schemas/K8sLocalObjectReference'
    WeaveRunStatus:
      type: object
      properties:
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Stopped
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRunStepStatus'
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        message:
          type: string
        sharedPVCName:
          type: string
        activeDeployments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WeaveActiveDeploymentStatus'
    WeaveRun:
      type: object
      properties:
        kind:
          type: string
          example: WeaveRun
        apiVersion:
          type: string
          example: weave.fusion-platform.io/v1alpha1
        metadata:
          $ref: '#/components/schemas/K8sObjectMeta'
        spec:
          $ref: '#/components/schemas/WeaveRunSpec'
        status:
          $ref: '#/components/schemas/WeaveRunStatus'
    WeaveRunList:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/WeaveListMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeaveRun'
    WeaveMonitorRunSummary:
      type: object
      properties:
        name:
          type: string
        chain:
          type: string
        phase:
          type: string
          enum:
          - Pending
          - Running
          - Succeeded
          - Failed
          - Stopped
        startTime:
          type: string
          format: date-time
          nullable: true
        completionTime:
          type: string
          format: date-time
          nullable: true
        stepCount:
          type: integer
        failedSteps:
          type: integer
        message:
          type: string
    WeaveMonitorRunDetail:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/WeaveRun'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/K8sJob'
        events:
          type: array
          items:
            $ref: '#/components/schemas/K8sEvent'
    WeaveMonitorLogResponse:
      type: object
      properties:
        runName:
          type: string
        stepName:
          type: string
        podName:
          type: string
        lines:
          type: array
          items:
            type: string
    WeaveMonitorRunStats:
      type: object
      properties:
        window:
          type: string
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        running:
          type: integer
        pending:
          type: integer
        stopped:
          type: integer
        successRate:
          type: number
          format: double
        avgDurationMs:
          type: integer
          format: int64
        minDurationMs:
          type: integer
          format: int64
        maxDurationMs:
          type: integer
          format: int64
    ContentError:
      type: object
      properties:
        error:
          type: string
    ContentPagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ChangelogChanges:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        changed:
          type: array
          items:
            type: string
        fixed:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
    ChangelogProjectEntry:
      type: object
      properties:
        project:
          type: string
        version:
          type: string
        changes:
          $ref: '#/components/schemas/ChangelogChanges'
    ChangelogDateGroup:
      type: object
      properties:
        date:
          type: string
          description: ISO YYYY-MM-DD, or "unreleased"
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogProjectEntry'
    ChangelogResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangelogDateGroup'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
    HelpArticleSummary:
      type: object
      properties:
        service:
          type: string
        type:
          type: string
          enum:
          - tutorial
          - how-to
          - reference
          - explanation
        slug:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        routes:
          type: array
          items:
            type: string
          description: Frontend paths for context-sensitive help
        summary:
          type: string
    HelpListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HelpArticleSummary'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
    ArticleResponse:
      allOf:
      - $ref: '#/components/schemas/HelpArticleSummary'
      - type: object
        properties:
          body:
            type: string
            description: Full markdown body
    VideoResponse:
      type: object
      properties:
        service:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        thumbnailUrl:
          type: string
        videoUrl:
          type: string
        tags:
          type: array
          items:
            type: string
    VideoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        pagination:
          $ref: '#/components/schemas/ContentPagination'
    WizardError:
      type: object
      description: Error shape shared across the platform's Go services (spectra reads `.error`).
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
    WizardParameter:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, number, boolean, stringList]
          default: string
        description:
          type: string
        required:
          type: boolean
        default: {}
        pattern:
          type: string
    WizardStep:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [gitWatcher, waitBuild, tag, jobTemplate, chain, trigger]
        forEach:
          type: string
          description: Expands this step once per item of a stringList parameter, e.g. "${params.entrypoints}".
        params:
          type: object
          additionalProperties:
            type: string
    WizardDefinitionSpec:
      type: object
      required: [steps]
      properties:
        description:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/WizardParameter'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WizardStep'
    WizardDefinition:
      type: object
      description: What clients see of a WizardDefinition. `valid`/`error` are computed — a hand-edited definition can fail the same validation a run-creation would hit.
      properties:
        name:
          type: string
        generation:
          type: integer
        valid:
          type: boolean
        error:
          type: string
        spec:
          $ref: '#/components/schemas/WizardDefinitionSpec'
    WizardDefinitionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WizardDefinition'
    WizardCreateRunRequest:
      type: object
      required: [definition]
      properties:
        definition:
          type: string
        name:
          type: string
          description: DNS-1123 subdomain. Generated from the definition name when omitted.
        parameters:
          type: object
          description: Keyed by parameter name; scalars are JSON strings/numbers/booleans, stringList values are JSON arrays of strings.
          additionalProperties: {}
    WizardManagedResourceRef:
      type: object
      required: [service, kind, name, disposition]
      properties:
        service:
          type: string
          enum: [forge, index, weave]
        kind:
          type: string
        name:
          type: string
        externalID:
          type: string
        disposition:
          type: string
          enum: [Created, Adopted, FoundUnowned]
    WizardRunStepStatus:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          description: Unique within the run — the step name, or "<name>/<item>" for forEach expansions.
        name:
          type: string
        type:
          type: string
          enum: [gitWatcher, waitBuild, tag, jobTemplate, chain, trigger]
        item:
          type: string
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, RolledBack, RollbackFailed]
        message:
          type: string
        failures:
          type: integer
        outputs:
          type: object
          additionalProperties:
            type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/WizardManagedResourceRef'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    WizardRunStatus:
      type: object
      properties:
        phase:
          type: string
          enum: [Pending, Running, Ready, Failed, RollingBack, RolledBack, RollbackFailed]
        message:
          type: string
        observedGeneration:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WizardRunStepStatus'
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    WizardRunView:
      type: object
      description: What clients see of a WizardRun — the request, who made it, and observed status. The definition snapshot is left out (large, operator-only).
      properties:
        name:
          type: string
        definition:
          type: string
        desiredState:
          type: string
          enum: [Applied, RolledBack]
        parameters:
          type: object
          additionalProperties: {}
        createdBy:
          type: string
        createdByEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        deleting:
          type: boolean
        status:
          $ref: '#/components/schemas/WizardRunStatus'
    WizardBulkRollbackRequest:
      type: object
      description: At least one of names/definition is required — an empty request is refused rather than meaning "everything".
      properties:
        names:
          type: array
          items:
            type: string
        definition:
          type: string
    WizardBulkRollbackFailure:
      type: object
      properties:
        name:
          type: string
        error:
          type: string
    WizardBulkRollbackResponse:
      type: object
      properties:
        accepted:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            $ref: '#/components/schemas/WizardBulkRollbackFailure'
    WizardResourceReference:
      type: object
      required: [run, step]
      properties:
        run:
          type: string
        step:
          type: string
    WizardResourceView:
      type: object
      description: One ledger entry — an upstream resource and every run step that references it. Read-only; mainly answers "why wasn't this deleted?" for a shared resource.
      properties:
        service:
          type: string
          enum: [forge, index, weave]
        kind:
          type: string
        name:
          type: string
        externalID:
          type: string
        specHash:
          type: string
        managed:
          type: boolean
        terminating:
          type: boolean
        refs:
          type: array
          items:
            $ref: '#/components/schemas/WizardResourceReference'
        createdAt:
          type: string
          format: date-time
  pathItems:
    proxy:
      parameters:
      - in: path
        name: path
        required: true
        schema:
          type: string
        description: Upstream path, forwarded verbatim after stripping the /api/<service> prefix
      get:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response forwarded verbatim
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      post:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response forwarded verbatim
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      put:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response forwarded verbatim
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      patch:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response forwarded verbatim
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
      delete:
        tags:
        - proxy
        summary: Proxy passthrough (any HTTP method)
        security:
        - sessionCookie: []
        - bearerAuth: []
        responses:
          '200':
            description: Upstream response forwarded verbatim
          '401':
            description: No valid session or bearer token
          '403':
            description: Missing required RBAC permission for this route
  responses:
    Preferences:
      description: The caller's preferences
      content:
        application/json:
          schema:
            type: object
            properties:
              preferred_owner_group:
                type: string
                nullable: true
                description: Stored preference; null when none is set
              effective:
                type: string
                nullable: true
                description: What the GUI should preselect (stored preference while still a member, else the default owner group)
    ForgeBadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeNotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeConflict:
      description: Resource already exists / build already in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    ForgeInternalError:
      description: Unexpected internal/upstream error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForgeError'
    WeaveBadRequest:
      description: Invalid request body or path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
    WeaveNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
    WeaveConflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WeaveError'
    WizardBadRequest:
      description: Invalid request body or query parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WizardError'
    WizardNotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WizardError'
    WizardConflict:
      description: A run with this name already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WizardError'
