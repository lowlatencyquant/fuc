          $ref: '#/components/responses/WeaveNotFound'
  /api/weave/api/v1/runs:
    get:
      tags:
      - weave
      summary: List WeaveRuns
      description: |
        Filter, sort and page WeaveRuns. The time window applies to status.startTime (creation time for runs not started yet). All filters are optional and combined with AND; multi-value filters accept repeated or
        comma-separated values and match any. Unknown values of enum filters, bad times or sort keys give 400.
        Pages follow the Kubernetes list shape: `metadata.continue` and `metadata.remainingItemCount` are set while
        more items follow.
      x-required-permission: weave:resources:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListSource'
      - $ref: '#/components/parameters/WeaveLabelSelector'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListContinue'
      - name: sort
        in: query
        description: Sort key, prefix `-` for descending; ties are broken by name. Default `-created`.
        schema:
          type: string
          enum: [name, -name, created, -created, started, -started, completed, -completed, duration, -duration]
      - name: phase
        in: query
        description: "Run phase(s): Pending (includes runs not reconciled yet), Running, Succeeded, Failed, Stopped."
        schema:
          type: string
          example: Running
      - name: chain
        in: query
        description: Name(s) of the WeaveChain (spec.chainRef).
        schema:
          type: string
      - name: trigger
        in: query
        description: Name(s) of the WeaveTrigger that created the run (spec.triggerRef).
        schema:
          type: string
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRunList'
    post:
      tags:
      - weave
      summary: Create a WeaveRun
      x-required-permission: weave:runs:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaveRun'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRun'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '409':
          $ref: '#/components/responses/WeaveConflict'
  /api/weave/api/v1/runs/facets:
    get:
      tags:
      - weave
      summary: Count WeaveRuns per phase, chain, trigger and source
      description: |
        For GUI filter drop-downs. Takes the same filters as GET /runs and counts the runs that match all of them
        (sort, limit and continue are ignored). Runs without a trigger are not counted under `trigger`.
      x-required-permission: weave:resources:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListSource'
      - $ref: '#/components/parameters/WeaveLabelSelector'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListContinue'
      - name: phase
        in: query
        description: "Run phase(s): Pending (includes runs not reconciled yet), Running, Succeeded, Failed, Stopped."
        schema:
          type: string
          example: Running
      - name: chain
        in: query
        description: Name(s) of the WeaveChain (spec.chainRef).
        schema:
          type: string
      - name: trigger
        in: query
        description: Name(s) of the WeaveTrigger that created the run (spec.triggerRef).
        schema:
          type: string
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRunFacets'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
  /api/weave/api/v1/runs/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - weave
      summary: Get a WeaveRun
      x-required-permission: weave:resources:read
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRun'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    put:
      tags:
      - weave
      summary: Replace a WeaveRun
      description: Full-object replace via client.Update — body must include metadata.resourceVersion for optimistic concurrency.
      x-required-permission: weave:runs:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaveRun'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRun'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    patch:
      tags:
      - weave
      summary: Partially update a WeaveRun
      description: |
        JSON Merge Patch (RFC 7396) applied directly to the live Kubernetes object. weave:steps:restart is the permission name (historical) — it covers any write that changes run phase, including this endpoint and the /stop action below. Also the way to change spec.imageOverrides[].image on a running run (rolling update); unknown fields are silently pruned.
      x-required-permission: weave:steps:restart
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRun'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    delete:
      tags:
      - weave
      summary: Delete a WeaveRun
      x-required-permission: weave:runs:delete
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/WeaveNotFound'
  /api/weave/api/v1/runs/{name}/stop:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - weave
      summary: Stop a running WeaveRun
      description: |
        Patches status.phase=Stopped via the status subresource, triggering the deploy-cleanup finalizer for any Deploy-kind steps.
      x-required-permission: weave:steps:restart
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveRun'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
        '409':
          description: Run is already in a terminal phase (Succeeded/Failed/Stopped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveError'
  /api/weave/api/v1/runs/{name}/image:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - weave
      summary: Set the image override of one step on a run
      description: |
        Upserts one entry of spec.imageOverrides on a non-terminal run (validated
        against the operator's allowed prefixes); a Deployed run-owned Deploy step
        is rolled to the new image. Requires permission weave:runs:image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepName, image]
              properties:
                stepName:
                  type: string
                image:
                  type: string
                imagePullPolicy:
                  type: string
                  enum: [Always, IfNotPresent, Never]
      responses:
        '200':
          description: Updated run
        '400':
          description: Invalid image or step name
        '409':
          description: Run is terminal or was modified concurrently
  /api/weave/api/v1/apps:
    get:
      tags:
      - weave
      summary: List WeaveApps
      description: |
        Filter, sort and page WeaveApps. The time window applies to the creation time. All filters are optional and combined with AND; multi-value filters accept repeated or
        comma-separated values and match any. Unknown values of enum filters, bad times or sort keys give 400.
        Pages follow the Kubernetes list shape: `metadata.continue` and `metadata.remainingItemCount` are set while
        more items follow.
      x-required-permission: weave:resources:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListSource'
      - $ref: '#/components/parameters/WeaveLabelSelector'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListContinue'
      - name: sort
        in: query
        description: Sort key, prefix `-` for descending; ties are broken by name. Default `name`.
        schema:
          type: string
          enum: [name, -name, created, -created, lastExecution, -lastExecution]
      - name: type
        in: query
        description: "App type(s): service, job."
        schema:
          type: string
          example: job
      - name: phase
        in: query
        description: "App phase(s): Pending, Ready, Running, Invalid."
        schema:
          type: string
          example: Ready
      - name: codeSource
        in: query
        description: true = only apps with spec.codeSource, false = only apps without.
        schema:
          type: boolean
      - name: running
        in: query
        description: true = only apps with a running execution (status.executions), false = only apps without.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveAppList'
    post:
      tags:
      - weave
      summary: Create a WeaveApp
      description: |
        Single-resource fast lane: type=service (Deployment + Service + Ingress) or type=job (entrypoints on a cron schedule or fired on demand). When the operator has ALLOWED_IMAGE_PREFIXES set, spec.image and spec.codeSource.loaderImage need an explicit non-latest tag or digest and an allowed prefix (400 otherwise).
      x-required-permission: weave:apps:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaveApp'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveApp'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '409':
          $ref: '#/components/responses/WeaveConflict'
  /api/weave/api/v1/apps/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - weave
      summary: Get a WeaveApp
      x-required-permission: weave:resources:read
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveApp'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    put:
      tags:
      - weave
      summary: Replace a WeaveApp
      description: Same image policy as POST.
      x-required-permission: weave:apps:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaveApp'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveApp'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    patch:
      tags:
      - weave
      summary: Partially update a WeaveApp
      description: JSON Merge Patch (RFC 7396) applied directly to the live Kubernetes object. Bypasses the API image check; the operator re-validates and marks a violating app Invalid.
      x-required-permission: weave:apps:write
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveApp'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
    delete:
      tags:
      - weave
      summary: Delete a WeaveApp
      description: Everything the app created (Deployment, Service, Ingress, Jobs) is owned by it and removed with it.
      x-required-permission: weave:apps:delete
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/WeaveNotFound'
  /api/weave/api/v1/apps/{name}/executions:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - weave
      summary: List the executions of a job WeaveApp
      description: |
        Filters, sorts and pages status.executions (the last 20). `q` searches the Job name, the time window
        applies to the start time; `source` and `labelSelector` do not apply to executions.
      x-required-permission: weave:resources:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListContinue'
      - name: sort
        in: query
        description: Sort key, prefix `-` for descending; ties are broken by name. Default `-started`.
        schema:
          type: string
          enum: [name, -name, started, -started, completed, -completed, entrypoint, -entrypoint]
      - name: phase
        in: query
        description: "Execution phase(s): Running, Succeeded, Failed."
        schema:
          type: string
          example: Failed
      - name: entrypoint
        in: query
        description: Entrypoint name(s).
        schema:
          type: string
      responses:
        '200':
          description: Executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/WeaveListMeta'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeaveAppExecution'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '404':
          $ref: '#/components/responses/WeaveNotFound'
  /api/weave/api/v1/apps/{name}/fire:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - weave
      summary: Fire one entrypoint of a job WeaveApp
      description: |
        Sets the fusion-platform.io/fire annotation the operator consumes, launching
        the entrypoint once. Touches nothing else, so it is granted separately from
        weave:apps:write (the common user role has it for Run now on wizard-created jobs).
      x-required-permission: weave:apps:fire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entrypoint]
              properties:
                entrypoint:
                  type: string
      responses:
        '202':
          description: Fire accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveApp'
        '400':
          description: Missing or unknown entrypoint, or not a job app
        '404':
          $ref: '#/components/responses/WeaveNotFound'
        '409':
          description: An execution of this entrypoint is still running
  /api/weave/api/v1/image-overrides/options:
    get:
      tags:
      - weave
      summary: List allowed image prefixes for imageOverrides
      description: Echoes the operator's ALLOWED_IMAGE_PREFIXES; an empty list means overrides are disabled.
      responses:
        '200':
          description: Allowed prefixes
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowedPrefixes:
                    type: array
                    items:
                      type: string
  /api/weave/api/v1/external-auth/options:
    get:
      tags:
      - weave
      summary: List allowlisted names for externalAuthRef
      description: |
        Reports the deploy-time allowlists configured for WeaveExternalAuthRef —
        ServiceAccount names valid for mode=serviceAccount and Secret names valid
        for mode=oidc — so a GUI can populate a name picker for whichever mode the
        user selects, instead of hardcoding or guessing valid values. Echoes the
        operator's static config as-is (EXTERNAL_AUTH_SERVICE_ACCOUNTS/
        EXTERNAL_AUTH_OIDC_SECRETS or the equivalent externalAuth.* Helm values) —
        no cluster lookup, so an allowlisted name that doesn't exist yet still
        appears here. Covered by the generic GET /api/weave/* catch-all
        (weave:resources:read) — no dedicated permission.
      x-required-permission: weave:resources:read
      responses:
        '200':
          description: Allowlisted names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveExternalAuthOptions'
