      in: path
      required: true
      schema:
        type: string
    - name: step
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - weave-monitoring
      summary: Tail log snapshot for a step's pod
      description: |
        Resolves the step's job or deployment pod (preferring Running, then newest); tail length is server-configured (default 100 lines); 10s timeout, 4MiB read cap.
      x-required-permission: weave:monitoring:read
      responses:
        '200':
          description: Log snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveMonitorLogResponse'
        '404':
          description: Run not found, step not found / has no associated job, or no pods found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveError'
  /api/weave/monitor/v1/apps/{name}/logs:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - weave-monitoring
      summary: Tail log snapshot for a WeaveApp's pod
      description: |
        type=service: the Deployment's best pod. type=job: the newest execution's pod.
      x-required-permission: weave:monitoring:read
      parameters:
      - name: entrypoint
        in: query
        description: type=job only — pick the newest execution of this entrypoint.
        schema:
          type: string
      - name: execution
        in: query
        description: type=job only — pick a specific execution by Job name.
        schema:
          type: string
      - name: container
        in: query
        description: Container to read; code-loader selects the init container.
        schema:
          type: string
      responses:
        '200':
          description: Log snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveMonitorLogResponse'
        '404':
          description: App not found or no pods found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveError'
