      responses:
        '200':
          description: Paginated tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTagListPage'
        '400':
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/retention:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    get:
      tags:
      - index
      summary: Effective retention rule of an artifact
      description: The artifact's own policy if it has one, otherwise the most conservative merge of its
        types' policies (per field the maximum). `versionFilter` is the matching query string for the version
        list / bulk delete, with `olderThan` computed now.
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: Effective rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexEffectiveRetention'
