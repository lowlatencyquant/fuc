          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    put:
      tags:
      - index
      summary: Set the artifact's own retention policy
      x-required-permission: index:retention:manage
      x-resource-type: artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexSetRetentionRequest'
      responses:
        '200':
          description: Stored policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRetentionPolicy'
        '400':
          description: Neither keepLast nor maxAgeDays, or a value < 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Remove the artifact's own retention policy
      x-required-permission: index:retention:manage
      x-resource-type: artifact
      responses:
        '204':
          description: Removed
        '404':
          description: No policy on this artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/tags/{tag}:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    - $ref: '#/components/parameters/IndexTag'
    put:
      tags:
      - index
      summary: Assign tag to a version
      description: Atomically assigns the tag to the specified version. If the tag was previously assigned
        to another version it is moved.
      x-required-permission: index:artifacts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexAssignTagRequest'
      responses:
        '200':
          description: Tag assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTagResponse'
        '400':
          description: Invalid request body or malformed semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Delete tag
      x-required-permission: index:artifacts:write
      responses:
        '204':
          description: Tag deleted
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/versions/{semver}/files:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    - $ref: '#/components/parameters/IndexSemver'
    get:
      tags:
      - index
      summary: List files
      x-required-permission: index:artifacts:read
      parameters:
      - name: status
        in: query
        description: Only files with these statuses (repeatable, e.g. `?status=PENDING&status=ERROR`).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - AVAILABLE
            - ERROR
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexFileResponse'
        '400':
          description: Malformed semver or unknown status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    post:
      tags:
      - index
      summary: Upload file
      description: Uploads a file to the version using multipart/form-data with a `file` field. The file
        name must be unique within the version. Status is set to AVAILABLE on success.
      x-required-permission: index:versions:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexFileResponse'
        '400':
          description: Missing file field or malformed semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Artifact or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '409':
          description: A file with this name already exists for this version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/versions/{semver}/files/{fileId}:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    - $ref: '#/components/parameters/IndexSemver'
    - $ref: '#/components/parameters/IndexFileId'
    get:
      tags:
      - index
      summary: Get file metadata
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexFileResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Delete file
      description: Deletes the file record and its storage object.
      x-required-permission: index:versions:delete
      x-resource-type: artifact
      responses:
        '204':
          description: File deleted
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/types:
    get:
      tags:
      - index
      summary: List types
