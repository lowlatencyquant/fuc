  /api/index/q/metrics:
    get:
      tags:
      - index
      summary: Registry aggregate metrics
      description: 'Point-in-time counts from one read-only snapshot transaction, cached for `METRICS_CACHE_TTL`
        (default 60s; concurrent refreshes are collapsed into one). The maintenance indicators match the
        read filters and admin cleanups: `artifactsWithoutVersions` = `GET /artifacts?maxVersions=0`, `artifactsWithoutFiles`
        = `?minVersions=1&hasFiles=false`, `versionsWithoutFiles` = `GET /versions?hasFiles=false`, `brokenTags`
        = `GET /tags?broken=true`, `unusedTypes` = `GET /types?unused=true`. Always public — not behind
        the `/api/v1` auth middleware.'
      x-required-permission: index:metrics:read
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexMetricsSnapshot'
        '500':
          description: Database error while refreshing the snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts:
    get:
      tags:
      - index
      summary: List artifacts
      description: 'Returns a paginated list of artifacts. All given filters combine with AND (`type` itself
        is OR across its values). The maintenance views of the admin API are plain filters here, available
        to every reader: `maxVersions=0` (no versions), `minVersions=1&hasFiles=false` (versions but no
        files), `hasIncompleteFiles=true` (PENDING/ERROR uploads). `versionCount` and `largestVersionBytes`
        are stored per artifact and kept up to date by the database, so sorting by them costs no aggregation.'
      x-required-permission: index:artifacts:read
      parameters:
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      - name: name
        in: query
        required: false
        description: Filter by full name prefix (e.g. `org.platform`)
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Filter artifacts that have this tag assigned
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Filter artifacts that have at least one of the given types assigned. Repeatable for
          OR semantics (e.g. `?type=ml-model&type=dataset`).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - $ref: '#/components/parameters/IndexOlderThanFilter'
      - name: minVersions
        in: query
        description: Only artifacts with at least this many versions.
        schema:
          type: integer
          minimum: 0
      - name: maxVersions
        in: query
        description: Only artifacts with at most this many versions (`0` = artifacts without versions).
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/IndexHasFiles'
      - $ref: '#/components/parameters/IndexHasIncompleteFiles'
      - name: missingTag
        in: query
        description: Only artifacts that do NOT have this tag (e.g. `latest`).
        schema:
          type: string
      - name: minTotalBytes
        in: query
        description: Only artifacts whose versions total at least this many bytes.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: hasRetention
        in: query
        description: Whether a retention rule applies (own policy or via one of its types).
        schema:
          type: boolean
      - name: sort
        in: query
        description: '`largestVersion` = byte size of the artifact''s largest version (sum of its AVAILABLE
          files), `totalSize` = bytes of all its versions.'
        schema:
          type: string
          enum:
          - createdAt
          - name
          - versionCount
          - largestVersion
          - totalSize
          default: createdAt
      - name: order
        in: query
        description: Defaults to `asc` for `name`, `desc` otherwise.
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Paginated artifact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexArtifactPage'
        '400':
          description: Invalid filter or sort value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    post:
      tags:
      - index
      summary: Create artifact
      x-required-permission: index:artifacts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexCreateArtifactRequest'
      responses:
        '201':
          description: Artifact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexArtifactResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '409':
          description: An artifact with this full name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    get:
      tags:
      - index
      summary: Get artifact
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: Artifact found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexArtifactResponse'
