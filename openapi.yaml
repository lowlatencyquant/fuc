                items:
                  $ref: '#/components/schemas/K8sEvent'
        '400':
          description: fieldSelector fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveError'
  /api/wizard/api/v1/definitions:
    get:
      tags:
      - wizard
      summary: List WizardDefinitions
      description: |
        Definitions are instance-agnostic recipes a run is created from. `valid`/`error` report
        whether the definition would be rejected at run-creation time (e.g. a hand-edited definition
        with a typo in its step order).
      x-required-permission: wizard:definitions:read
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardDefinitionList'
  /api/wizard/api/v1/definitions/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - wizard
      summary: Get a WizardDefinition
      x-required-permission: wizard:definitions:read
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardDefinition'
        '404':
          $ref: '#/components/responses/WizardNotFound'
  /api/wizard/api/v1/runs:
    get:
      tags:
      - wizard
      summary: List WizardRuns
      description: |
        Sorted newest first by default. Filters: `definition` and `phase` (repeated or comma-separated, match any),
        `createdBy`, plus the shared list parameters (`q`, `since`/`until` on the creation time, `source=gitops` for
        runs Flux applied from a GitOps repo, `sort`, `continue`). `limit` defaults to 100 (max 500); `total`
        counts all matches, `continue` is present while more pages follow.
      x-required-permission: wizard:runs:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListSource'
      - $ref: '#/components/parameters/ListContinue'
      - name: sort
        in: query
        description: Sort key, prefix `-` for descending; ties are broken by name. Default `-created`.
        schema:
          type: string
          enum: [created, -created, name, -name, phase, -phase, definition, -definition]
      - name: definition
        in: query
        schema:
          type: string
      - name: phase
        in: query
        schema:
          type: string
      - name: createdBy
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WizardRunView'
                  total:
                    type: integer
                  continue:
                    type: string
                    description: Token for the next page; absent on the last page.
    post:
      tags:
      - wizard
      summary: Create a WizardRun
      description: |
        Validates the definition, parameters and step plan up front (the same checks the operator
        would run later), so a client sees every problem in one 422 instead of watching an accepted
        run fail. `name` is optional — generated from the definition name when omitted.
      x-required-permission: wizard:runs:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardCreateRunRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '400':
          $ref: '#/components/responses/WizardBadRequest'
        '409':
          $ref: '#/components/responses/WizardConflict'
        '422':
          description: The definition or supplied parameters are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardError'
  /api/wizard/api/v1/runs/bulk-rollback:
    post:
      tags:
      - wizard
      summary: Roll back many runs at once
      description: |
        Requires a selector (`names` and/or `definition`) — an empty request is refused rather than
        meaning "everything". Capped at 200 matched runs; narrow the selection if it matches more.
        Rolling back a shared resource is safe by construction: the ledger only deletes it upstream
        once the last referencing run is gone.
      x-required-permission: wizard:runs:bulk-rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardBulkRollbackRequest'
      responses:
        '200':
          description: Nothing newly accepted (all requested runs were already RolledBack, or all failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardBulkRollbackResponse'
        '202':
          description: At least one run's rollback was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardBulkRollbackResponse'
        '400':
          $ref: '#/components/responses/WizardBadRequest'
  /api/wizard/api/v1/runs/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - wizard
      summary: Get a WizardRun
      x-required-permission: wizard:runs:read
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '404':
          $ref: '#/components/responses/WizardNotFound'
    delete:
      tags:
      - wizard
      summary: Delete a WizardRun
      description: |
        The operator's finalizer rolls everything the run provisioned back first, so a run that had
        provisioned anything disappears asynchronously; the response reflects that with 202 and the
        run's current (rolling-back) state. A run that had provisioned nothing yet disappears immediately (204).
      x-required-permission: wizard:runs:delete
      responses:
        '202':
          description: Deletion requested; rollback is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '204':
          description: Deleted immediately — nothing had been provisioned
        '404':
          $ref: '#/components/responses/WizardNotFound'
  /api/wizard/api/v1/runs/{name}/retry:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - wizard
      summary: Retry a Failed run
      description: Sets a one-shot retry annotation the operator consumes on its next reconcile.
      x-required-permission: wizard:runs:retry
      responses:
        '202':
          description: Retry requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '404':
          $ref: '#/components/responses/WizardNotFound'
        '409':
          description: Only a Failed run can be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardError'
  /api/wizard/api/v1/runs/{name}/rollback:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - wizard
      summary: Roll back a run
      description: |
        Sets desiredState=RolledBack; idempotent (200 if the run was already RolledBack, 202 the
        first time). The run object itself stays afterwards, as a record — deleting it is a separate call.
      x-required-permission: wizard:runs:rollback
      responses:
        '200':
          description: Already RolledBack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '202':
          description: Rollback requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardRunView'
        '404':
          $ref: '#/components/responses/WizardNotFound'
  /api/wizard/api/v1/resources:
    get:
      tags:
      - wizard
      summary: List ledger entries
      description: |
        Read-only diagnostic view of the ledger: which upstream resources are wizard-tracked, whether
        they're `managed` (eligible for deletion) and which run steps currently reference them —
        answers "why wasn't this deleted?" for a shared resource. Supports `?service=` and `?kind=` filters.
      x-required-permission: wizard:resources:read
      parameters:
      - name: service
        in: query
        schema:
          type: string
      - name: kind
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WizardResourceView'
  /api/content/api/v1/changelog:
    get:
      tags:
      - content
      summary: List merged changelog entries across projects
      x-required-permission: content:changelog:read
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: project
        in: query
        schema:
          type: string
        description: Exact-match project name filter
      - name: date
        in: query
        schema:
          type: string
        description: ISO YYYY-MM-DD, or the literal "unreleased"
      responses:
        '200':
          description: |
            Paginated changelog date-groups. Invalid page/pageSize silently fall back to defaults; an unmatched project/date filter yields an empty data array (not an error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogResponse'
  /api/content/api/v1/help:
    get:
      tags:
      - content
      summary: List/search help article summaries
      x-required-permission: content:help:read
      parameters:
      - name: service
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - tutorial
          - how-to
          - reference
          - explanation
      - name: tag
        in: query
        schema:
          type: string
      - name: route
        in: query
        schema:
          type: string
        description: Frontend route path filter
      - name: q
        in: query
        schema:
          type: string
        description: Full-text search (AND over tokenized title+summary+body+tags)
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated help article summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpListResponse'
  /api/content/api/v1/help/{service}/{type}/{slug}:
    parameters:
    - name: service
      in: path
      required: true
      schema:
        type: string
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum:
        - tutorial
        - how-to
        - reference
        - explanation
    - name: slug
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - content
      summary: Get a single help article, including full body
      x-required-permission: content:help:read
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentError'
  /api/content/api/v1/videos:
    get:
      tags:
      - content
      summary: List video metadata
      x-required-permission: content:videos:read
      parameters:
      - name: service
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated video list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
  /api/content/api/v1/videos/{service}/{slug}:
    parameters:
    - name: service
      in: path
      required: true
      schema:
        type: string
    - name: slug
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - content
      summary: Get a single video's metadata
      x-required-permission: content:videos:read
      responses:
        '200':
          description: Video found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentError'
  /api/forge/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/index/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/weave/{path}:
    $ref: '#/components/pathItems/proxy'
  /api/content/{path}:
    $ref: '#/components/pathItems/proxy'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly session cookie set by /bff/callback
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token, accepted as a fallback when no session cookie is present
  parameters:
    ListQ:
      name: q
      in: query
      description: Case-insensitive substring of the name.
      schema:
        type: string
        maxLength: 256
    ListSince:
      name: since
      in: query
      description: Start of the time window (inclusive). RFC 3339 time, or a duration back from now (`90m`, `24h`, `7d`).
      schema:
        type: string
        example: 24h
    ListUntil:
      name: until
      in: query
      description: End of the time window (exclusive), same formats as `since`.
      schema:
        type: string
    ListSource:
      name: source
      in: query
      description: |
        Where the item came from: `gitops` (applied by Flux, i.e. labelled `kustomize.toolkit.fluxcd.io/name`, or
        `fusion-platform.io/managed-by=gitops`) or any `fusion-platform.io/managed-by` value (`manual`, `wizard`, ...).
        Repeatable or comma-separated; matches any.
      schema:
        type: string
        example: gitops
    ListLimit:
      name: limit
      in: query
      description: Page size (1-500). Without it the whole filtered list is returned.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    ListContinue:
      name: continue
      in: query
      description: Opaque token from `metadata.continue` of the previous page; keep the other parameters unchanged.
      schema:
        type: string
    WeaveLabelSelector:
      name: labelSelector
      in: query
      description: Kubernetes label selector, applied by the Kubernetes list call (e.g. `fusion-platform.io/owner-group=team-a`).
      schema:
        type: string
    IndexArtifactId:
      name: id
      in: path
      required: true
      description: Artifact ID
      schema:
        type: integer
        format: int64
    IndexSemver:
      name: semver
      in: path
      required: true
      description: Semantic version string (`major.minor.patch`)
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
        example: 1.2.3
    IndexFileId:
      name: fileId
      in: path
      required: true
      description: File ID
      schema:
        type: integer
        format: int64
    IndexTag:
      name: tag
      in: path
      required: true
      description: Tag name (e.g. `latest`, `stable`)
      schema:
        type: string
        maxLength: 255
    IndexTypeId:
      name: typeId
      in: path
      required: true
      description: Type ID
      schema:
        type: integer
        format: int64
    IndexPage:
      name: page
      in: query
      required: false
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    IndexPageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page
      schema:
        type: integer
        minimum: 1
        default: 20
    IndexOlderThan:
      name: olderThan
      in: query
      required: true
      description: Return only items created before this timestamp (RFC3339, e.g. `2024-01-01T00:00:00Z`).
      schema:
        type: string
        format: date-time
        example: '2024-01-01T00:00:00Z'
    IndexOlderThanFilter:
      name: olderThan
      in: query
      required: false
      description: Only items created before this timestamp (RFC3339).
      schema:
        type: string
        format: date-time
        example: '2024-01-01T00:00:00Z'
    IndexKeepLast:
      name: keepLast
      in: query
      description: Skip the newest N versions of each artifact (by semver), match the rest.
      schema:
        type: integer
        minimum: 1
    IndexVersionFrom:
      name: from
      in: query
      description: Only versions >= this semver (inclusive).
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
    IndexVersionBelow:
      name: below
      in: query
      description: Only versions < this semver (exclusive).
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
    IndexVersionList:
      name: version
      in: query
      description: Exact versions (repeatable, e.g. `?version=1.0.0&version=1.0.1`). Per artifact only.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: ^\d+\.\d+\.\d+$
    IndexHasFiles:
      name: hasFiles
      in: query
      description: '`false` = no file at all (any status), `true` = at least one file.'
      schema:
        type: boolean
    IndexHasIncompleteFiles:
      name: hasIncompleteFiles
      in: query
      description: '`true` = at least one PENDING/ERROR file (interrupted or failed upload).'
      schema:
        type: boolean
    IndexMinBytes:
      name: minBytes
      in: query
      description: Only versions whose AVAILABLE files total at least this many bytes.
      schema:
        type: integer
        format: int64
        minimum: 0
    IndexMaxBytes:
      name: maxBytes
      in: query
      description: Only versions whose AVAILABLE files total at most this many bytes.
      schema:
        type: integer
        format: int64
        minimum: 0
    IndexDeletable:
      name: deletable
      in: query
      description: '`true` hides versions a bulk delete would skip (tagged versions, artifacts with the protection
        tag), so the list shows exactly what the DELETE with the same filters would remove.'
      schema:
        type: boolean
        default: false
    IndexDryRun:
      name: dryRun
      in: query
      description: Report what would be deleted without deleting anything.
      schema:
        type: boolean
        default: false
  schemas:
    GroupRoleRow:
      type: object
      properties:
        id:
          type: integer
        group_name:
          type: string
        role_name:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    UserRoleRow:
      type: object
      properties:
        id:
          type: integer
        user_sub:
          type: string
          description: OIDC "sub" claim of the user
        role_name:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    ResourcePermRow:
      type: object
      properties:
        id:
          type: integer
        subject_type:
          type: string
          enum:
          - user
          - group
          - role
        subject:
          type: string
        permission:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    OwnerGroupRow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    OwnerGroupMappingRow:
      type: object
      properties:
        id:
          type: integer
        owner_group:
          type: string
        oidc_group:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    OwnerGroupMemberRow:
      type: object
      properties:
        id:
          type: integer
        owner_group:
          type: string
        match_type:
          type: string
        match_value:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    ServiceStatusRow:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
          enum:
          - Healthy
          - Unhealthy
          - Offline
          - Maintenance
        description:
          type: string
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    ForgeError:
      type: object
      properties:
        error:
          type: string
    ForgeBuildResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          example: SUCCESS
          description: PENDING | BUILDING | SUCCESS | FAILED
        buildType:
          type: string
          description: requirements | git | app
        creatorId:
          type: string
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        indexArtifactId:
          type: integer
          format: int64
          nullable: true
        indexArtifactVersion:
          type: string
          nullable: true
        ciBuildName:
          type: string
          nullable: true
        repoUrl:
          type: string
          nullable: true
        repoRef:
          type: string
          nullable: true
        entrypointFile:
          type: string
          nullable: true
        metadataSource:
          type: string
        projectDir:
          type: string
          nullable: true
        pythonVersion:
          type: string
          example: '3.12'
        runner:
          type: string
          nullable: true
        baseDependenciesUrl:
          type: string
          nullable: true
        fileUploadMode:
          type: string
          nullable: true
          description: |
            App builds only. legacy | auto | list — derived from metadata.yaml's `files` key.
            legacy: main.py is the only uploaded file (metadata.yaml has no `files` key).
            auto: every top-level *.py file was auto-discovered and uploaded (`files: []`).
            list: exactly the files named in `files` (below) were uploaded.
        files:
          type: array
          items:
            type: string
          description: App builds only, and only populated when fileUploadMode is "list".
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ForgePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ForgeBuildResponse'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    ForgeViolation:
      type: object
      properties:
        line:
          type: integer
        content:
          type: string
        message:
          type: string
    ForgeValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ForgeViolation'
    ForgeBulkDeleteResponse:
      type: object
      properties:
        deleted:
          type: array
          items:
            type: integer
            format: int64
        failed:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              error:
                type: string
    BulkDeleteBuildsRequest:
      type: object
      required:
      - statuses
      properties:
        statuses:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - FAILED
            - SUCCESS
        older_than:
          type: string
          format: date-time
        build_type:
          type: string
          description: requirements | git | app
    ZombieCleanupRequest:
      type: object
      properties:
        older_than:
          type: string
          format: date-time
        build_type:
          type: string
          description: requirements | git | app
    CreateVenvRequest:
      type: object
      required:
      - name
      - version
      - requirements
      properties:
        name:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 2000
        requirements:
          type: string
          format: binary
          description: requirements.txt, 1 byte - 100KB
        python_version:
          type: string
          maxLength: 10
          enum:
          - '3.10'
          - '3.12'
          default: '3.12'
