  /api/weave/api/v1/triggers:
    get:
      tags:
      - weave
      summary: List WeaveTriggers (all types)
      description: |
        Filter, sort and page WeaveTriggers. All filters are optional and combined with AND; multi-value filters accept repeated or
        comma-separated values and match any. Unknown values of enum filters, bad times or sort keys give 400.
        Pages follow the Kubernetes list shape: `metadata.continue` and `metadata.remainingItemCount` are set while
        more items follow.
      x-required-permission: weave:resources:read
      parameters:
      - $ref: '#/components/parameters/ListQ'
      - $ref: '#/components/parameters/ListSince'
      - $ref: '#/components/parameters/ListUntil'
      - $ref: '#/components/parameters/ListSource'
      - $ref: '#/components/parameters/WeaveLabelSelector'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListContinue'
      - name: sort
        in: query
        description: Sort key, prefix `-` for descending; ties are broken by name. Default `name`.
        schema:
          type: string
          enum: [name, -name, created, -created, lastSchedule, -lastSchedule]
      - name: type
        in: query
        description: "Trigger type(s): OnDemand, Cron, Webhook, BatchCron, Kafka."
        schema:
          type: string
          example: Cron
      - name: chain
        in: query
        description: Name(s) of the triggered WeaveChain.
        schema:
          type: string
      - name: paused
        in: query
        description: spec.paused
        schema:
          type: boolean
      - name: active
        in: query
        description: status.active
        schema:
          type: boolean
      - name: quarantined
        in: query
        description: status.quarantined
        schema:
          type: boolean
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveTriggerList'
    post:
      tags:
      - weave
      summary: Create a WeaveTrigger
      description: |
        Generic CRUD for any trigger type (OnDemand, Cron, Webhook, BatchCron, Kafka). BatchCron and Kafka triggers are more commonly managed via the dedicated /batchtriggers and /kafkatriggers endpoints below, which offer purpose-built DTOs.
      x-required-permission: weave:triggers:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeaveTrigger'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeaveTrigger'
        '400':
          $ref: '#/components/responses/WeaveBadRequest'
        '409':
          $ref: '#/components/responses/WeaveConflict'
