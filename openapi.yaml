                items:
                  $ref: '#/components/schemas/IndexTypeResponse'
    post:
      tags:
      - index
      summary: Create type
      x-required-permission: index:types:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexCreateTypeRequest'
      responses:
        '201':
          description: Type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTypeResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '409':
          description: A type with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/types/{typeId}:
    parameters:
    - $ref: '#/components/parameters/IndexTypeId'
    get:
      tags:
      - index
      summary: Get type
      x-required-permission: index:types:manage
      responses:
        '200':
          description: Type found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTypeResponse'
        '404':
          description: Type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    put:
      tags:
      - index
      summary: Update type
      x-required-permission: index:types:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexUpdateTypeRequest'
      responses:
        '200':
          description: Type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTypeResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '409':
          description: A type with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Delete type
      description: Deletes the type and removes all its artifact assignments (cascade).
      x-required-permission: index:types:manage
      responses:
        '204':
          description: Type deleted
        '404':
          description: Type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/types/{typeId}/retention:
    parameters:
    - $ref: '#/components/parameters/IndexTypeId'
    get:
      tags:
      - index
      summary: Retention policy of a type
      x-required-permission: index:types:manage
      responses:
        '200':
          description: Stored policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRetentionPolicy'
        '404':
          description: No policy on this type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    put:
      tags:
      - index
      summary: Set the type's retention policy
      description: Applies to every artifact of this type that has no policy of its own.
      x-required-permission: index:retention:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexSetRetentionRequest'
      responses:
        '200':
          description: Stored policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRetentionPolicy'
        '400':
          description: Neither keepLast nor maxAgeDays, or a value < 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
        '404':
          description: Type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Remove the type's retention policy
      x-required-permission: index:retention:manage
      responses:
        '204':
          description: Removed
        '404':
          description: No policy on this type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/retention-policies:
    get:
      tags:
      - index
      summary: List all retention policies
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: All stored policies with artifact or type name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexRetentionPolicy'
  /api/index/api/v1/artifacts/{id}/types:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    get:
      tags:
      - index
      summary: List artifact types
      description: Returns all types assigned to the artifact, ordered by name.
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: Type list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexTypeResponse'
        '404':
          description: Artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/types/{typeId}:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    - $ref: '#/components/parameters/IndexTypeId'
    put:
      tags:
      - index
      summary: Assign type to artifact
      description: Assigns the type to the artifact. Idempotent — assigning an already-assigned type returns
        200 without error.
      x-required-permission: index:artifacts:write
      responses:
        '200':
          description: Type assigned (returns the type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTypeResponse'
        '404':
          description: Artifact or type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Remove type from artifact
      description: |-
        Removes the type assignment from the artifact. Returns 404 if not assigned.

        RBAC note: unexpectedly matches the DELETE .../artifacts/* rule (trailing wildcard absorbs "types/{typeId}"), so this requires index:artifacts:delete — the same permission as deleting the whole artifact — verified via MatchRoute. Likely an unintended coupling worth a follow-up rbac.yaml decision.
      x-required-permission: index:artifacts:delete
      x-resource-type: artifact
      responses:
        '204':
          description: Type removed
        '404':
          description: Artifact not found, type not found, or type not assigned to artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/artifacts/{id}/versions/{semver}/files/{fileId}/download:
    parameters:
    - $ref: '#/components/parameters/IndexArtifactId'
    - $ref: '#/components/parameters/IndexSemver'
    - $ref: '#/components/parameters/IndexFileId'
    get:
      tags:
      - index
      summary: Download file
      description: Streams the file content. Responds with a `Content-Disposition` header for save-as.
      x-required-permission: index:artifacts:read
      responses:
        '200':
          description: File stream
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="model.onnx"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/artifacts/empty:
    get:
      tags:
      - index
      summary: List artifacts with no versions
      description: Returns a paginated list of artifacts that have no versions and were created before `olderThan`.
        Useful for finding abandoned artifact registrations.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      responses:
        '200':
          description: Paginated list of empty artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexArtifactPage'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Bulk delete artifacts with no versions
      description: Deletes all artifacts that have no versions and were created before `olderThan`. Artifacts
        carrying the configured protection tag are skipped and counted in `skipped`.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkDeleteResponse'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/versions:
    delete:
      tags:
      - index
      summary: Bulk delete versions across all artifacts
      description: Applies the version bulk-delete filters to every artifact (`keepLast` counts per artifact).
        The `version` list filter is only available per artifact. All given filters must match (AND); at
        least one is required. Versions a tag points at, and every version of an artifact carrying the protection
        tag, are never deleted and are counted as `skipped`. Files of deleted versions are removed from
        storage (best-effort, after the DB commit).
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexKeepLast'
      - $ref: '#/components/parameters/IndexOlderThanFilter'
      - $ref: '#/components/parameters/IndexVersionFrom'
      - $ref: '#/components/parameters/IndexVersionBelow'
      - $ref: '#/components/parameters/IndexHasFiles'
      - $ref: '#/components/parameters/IndexHasIncompleteFiles'
      - $ref: '#/components/parameters/IndexMinBytes'
      - $ref: '#/components/parameters/IndexMaxBytes'
      - $ref: '#/components/parameters/IndexDryRun'
      responses:
        '200':
          description: Deleted (or, with dryRun, deletable) versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkVersionDeleteResponse'
        '400':
          description: No filter given or invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/versions/empty:
    get:
      tags:
      - index
      summary: List versions with no files
      description: Returns a paginated list of versions that have no files and were created before `olderThan`.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      responses:
        '200':
          description: Paginated list of versions without files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexVersionPage'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Bulk delete versions with no files
      description: Deletes all versions that have no files and were created before `olderThan`. Versions
        whose parent artifact carries the configured protection tag are skipped.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkDeleteResponse'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/types/unused:
    get:
      tags:
      - index
      summary: List types assigned to no artifact
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      responses:
        '200':
          description: Paginated list of unused types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTypePage'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Bulk delete types assigned to no artifact
      description: Their retention policies are deleted with them.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkDeleteResponse'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/files/incomplete:
    get:
      tags:
      - index
      summary: List incomplete (PENDING/ERROR) files
      description: Returns a paginated list of files whose upload never completed — status `PENDING` (interrupted
        upload) or `ERROR` (failed upload) — and were created before `olderThan`. Such files are never downloadable
        but keep their version from counting as file-less.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      responses:
        '200':
          description: Paginated list of incomplete files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexFilePage'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
    delete:
      tags:
      - index
      summary: Bulk delete incomplete (PENDING/ERROR) files
      description: Deletes all `PENDING`/`ERROR` files created before `olderThan`, including (best-effort)
        any partial object a failed upload left in storage. Files of artifacts carrying the configured protection
        tag are skipped. Choose `olderThan` well in the past so uploads still in flight are not hit.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexBulkDeleteResponse'
        '400':
          description: Missing or invalid olderThan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexError'
  /api/index/api/v1/admin/artifacts/no-files:
    get:
      tags:
      - index
      summary: List artifacts with versions but no files
      description: Returns a paginated list of artifacts that have at least one version but no files on
        any version, and were created before `olderThan`.
      x-required-permission: index:admin:manage
      parameters:
      - $ref: '#/components/parameters/IndexOlderThan'
      - $ref: '#/components/parameters/IndexPage'
      - $ref: '#/components/parameters/IndexPageSize'
      responses:
        '200':
          description: Paginated list of artifacts without files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexArtifactPage'
        '400':
          description: Missing or invalid olderThan
          content:
